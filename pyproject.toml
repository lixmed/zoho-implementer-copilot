[project]
name = "zoho-implementer-copilot"
version = "0.1.0"
description = "Local AI copilot that turns client requirements into Zoho CRM implementations, with a human approving every step."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "keyring>=25",
    "platformdirs>=4",
    "python-docx>=1.2.0",
    "pypdf>=7.1.1",
]

[project.scripts]
copilot = "copilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake secrets in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
